<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand Intake · Pitch Deck Creators</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="https://www.pitchdeckcreators.com/">
      <img src="assets/logo.svg" alt="" width="22" height="22">
      <span>Pitch Deck Creators</span>
    </a>
    <a class="nav-link" href="https://www.pitchdeckcreators.com/">Home</a>
  </header>

  <main class="container">
    <form id="brand-form" novalidate>
      <!-- Intro and sections are rendered from questions.js -->
      <div id="form-root"></div>

      <div class="actions">
        <button type="submit" class="btn-primary" id="submit-btn"></button>
        <button type="button" class="btn-link" id="clear-btn"></button>
      </div>
    </form>

    <section class="thanks" id="thanks" hidden>
      <h2 class="display" id="thanks-title"></h2>
      <p id="thanks-text"></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="brand brand--light">
        <img src="assets/logo.svg" alt="" width="22" height="22">
        <span>Pitch Deck Creators</span>
      </div>
      <p class="footer-tagline" id="footer-tagline"></p>
      <div class="footer-bottom">
        <span id="footer-copy"></span>
        <span id="footer-location"></span>
        <a href="#" class="footer-admin">Admin</a>
      </div>
    </div>
  </footer>

  <script src="questions.js"></script>
  <script src="form.js"></script>
</body>
</html>
