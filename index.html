<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand Intake · Pitch Deck Creators</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/favicon.png" type="image/png">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="https://www.pitchdeckcreators.com/">
      <img src="assets/logo.svg" alt="Pitch Deck Creators" width="160" height="24">
    </a>
    <a class="nav-link" href="https://www.pitchdeckcreators.com/">Home</a>
  </header>

  <main class="container">
    <!-- Start screen: "Do you already have a brand?" (rendered from questions.js) -->
    <section id="start" class="start"></section>

    <form id="brand-form" novalidate hidden>
      <button type="button" class="btn-back" id="back-btn">← Back</button>
      <!-- Intro and sections are rendered from questions.js -->
      <div id="form-root"></div>

      <div class="actions">
        <button type="submit" class="btn-primary" id="submit-btn"></button>
        <button type="button" class="btn-link" id="clear-btn"></button>
      </div>
    </form>

    <section class="thanks" id="thanks" hidden>
      <h2 class="display" id="thanks-title"></h2>
      <p id="thanks-text"></p>
    </section>
  </main>

  <div class="modal" id="thanks-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-card">
      <h2 class="display" id="modal-title"></h2>
      <p id="modal-text"></p>
      <button type="button" class="btn-primary btn-plain" id="modal-btn"></button>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="brand">
        <img src="assets/logo-light.svg" alt="Pitch Deck Creators" width="160" height="24">
      </div>
      <p class="footer-tagline" id="footer-tagline"></p>
      <div class="footer-bottom">
        <span id="footer-copy"></span>
        <span id="footer-location"></span>
        <a href="#" class="footer-admin">Admin</a>
      </div>
    </div>
  </footer>

  <script src="questions.js"></script>
  <script src="form.js"></script>
</body>
</html>
